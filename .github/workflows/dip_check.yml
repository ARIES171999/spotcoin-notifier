name: Dip Watcher

on:
  schedule:
    # Runs every 4 hours. Edit the cron expression to change frequency.
    - cron: '0 */4 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

permissions:
  contents: none

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore watcher state (for cooldown/confirmation tracking)
        uses: actions/cache@v4
        with:
          path: dip_watcher_state.json
          key: dip-watcher-state-${{ github.run_id }}
          restore-keys: |
            dip-watcher-state-

      - run: pip install requests

      - name: Run dip check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_TRIGGER: ${{ github.event_name }}
        run: python dip_watcher.py

      - name: Save watcher state
        uses: actions/cache/save@v4
        with:
          path: dip_watcher_state.json
          key: dip-watcher-state-${{ github.run_id }}
